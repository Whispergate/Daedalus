name: Daedalus Manual Build
description: Manually trigger a CI/CD build from Mythic
trigger: manual
trigger_data: {}
environment:
    PROVIDER: jenkins
    JOB: ""
    JENKINS_URL: ""
    JENKINS_USER: ""
    JENKINS_TOKEN: ""
    LANGUAGE: c-mingw
    OUTPUT_FORMAT: exe
    OBFUSCATION: none
    PACKER_FLAGS: ""
    SIGNING_PROFILE: none
    PE_SANITISE: "true"
    TARGET_ARCH: amd64
    PAYLOAD_UUID: ""
    POLL: "true"
    TIMEOUT: "300"
    OPERATOR_ID: ""
    CAMPAIGN_TAG: ""
keywords:
    - daedalus
    - build
    - cicd
run_as: bot
steps:
    - name: trigger_build
      description: Trigger a CI/CD build and poll for completion
      action: custom_function
      action_data:
          container_name: daedalus
          function_name: trigger_build
      inputs:
          provider: "{{env.PROVIDER}}"
          job: "{{env.JOB}}"
          jenkins_token: "{{env.JENKINS_TOKEN}}"
          mythic_api_token: "{{mythic.apitoken}}"
          payload_uuid: "{{env.PAYLOAD_UUID}}"
          poll: "{{env.POLL}}"
          timeout: "{{env.TIMEOUT}}"
          language: "{{env.LANGUAGE}}"
          output_format: "{{env.OUTPUT_FORMAT}}"
          obfuscation: "{{env.OBFUSCATION}}"
          packer_flags: "{{env.PACKER_FLAGS}}"
          signing_profile: "{{env.SIGNING_PROFILE}}"
          pe_sanitise: "{{env.PE_SANITISE}}"
          target_arch: "{{env.TARGET_ARCH}}"
          operator_id: "{{env.OPERATOR_ID}}"
          campaign_tag: "{{env.CAMPAIGN_TAG}}"
