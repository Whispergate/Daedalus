name: Daedalus Scan Payload
description: Submit a payload to LitterBox for scanning via Sphinx
trigger: manual
trigger_data: {}
environment:
    PAYLOAD_UUID: ""
    SCAN_TYPE: all
    LITTERBOX_URL: http://10.5.99.12:1337
    TIMEOUT: "120"
keywords:
    - daedalus
    - scan
    - sphinx
    - litterbox
run_as: bot
steps:
    - name: scan
      description: Submit payload to LitterBox for analysis
      action: custom_function
      action_data:
          container_name: sphinx
          function_name: execute_script
      inputs:
          payload_uuid: "{{env.PAYLOAD_UUID}}"
          mythic_api_token: "{{mythic.apitoken}}"
          litterbox_url: "{{env.LITTERBOX_URL}}"
          scan_type: "{{env.SCAN_TYPE}}"
          timeout: "{{env.TIMEOUT}}"
