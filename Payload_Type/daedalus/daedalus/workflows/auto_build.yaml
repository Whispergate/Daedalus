name: Daedalus Auto Build
description: Automatically build, download artifact, upload to Mythic, and scan when a payload is built
trigger: payload_build_finish
trigger_data:
    payload_types: []
environment:
    PROVIDER: jenkins
    JOB: ""
    JENKINS_URL: ""
    JENKINS_USER: ""
    JENKINS_TOKEN: ""
    LANGUAGE: c-mingw
    OUTPUT_FORMAT: exe
    OBFUSCATION: none
    NIMCRYPT2_FLAGS: ""
    SIGNING_PROFILE: none
    PE_SANITISE: "true"
    TARGET_ARCH: amd64
    LITTERBOX_SCAN: "true"
    TIMEOUT: "300"
    SCAN_TYPE: all
    LITTERBOX_URL: ""
    OPERATOR_ID: ""
    CAMPAIGN_TAG: ""
keywords:
    - daedalus
    - build
    - auto
    - scan
run_as: bot
steps:
    - name: build_and_scan
      description: Build, download artifact, upload to Mythic, and scan via LitterBox
      action: custom_function
      action_data:
          container_name: daedalus
          function_name: build_and_scan
      inputs:
          provider: "{{env.PROVIDER}}"
          job: "{{env.JOB}}"
          jenkins_token: "{{env.JENKINS_TOKEN}}"
          mythic_api_token: "{{mythic.apitoken}}"
          payload_uuid: "{{trigger.payload_uuid}}"
          timeout: "{{env.TIMEOUT}}"
          language: "{{env.LANGUAGE}}"
          output_format: "{{env.OUTPUT_FORMAT}}"
          obfuscation: "{{env.OBFUSCATION}}"
          nimcrypt2_flags: "{{env.NIMCRYPT2_FLAGS}}"
          signing_profile: "{{env.SIGNING_PROFILE}}"
          pe_sanitise: "{{env.PE_SANITISE}}"
          target_arch: "{{env.TARGET_ARCH}}"
          litterbox_scan: "{{env.LITTERBOX_SCAN}}"
          litterbox_url: "{{env.LITTERBOX_URL}}"
          scan_type: "{{env.SCAN_TYPE}}"
          operator_id: "{{env.OPERATOR_ID}}"
          campaign_tag: "{{env.CAMPAIGN_TAG}}"
